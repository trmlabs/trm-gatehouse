name: Keep upstream release tags

# Copies every Infisical/agent-vault tag into this fork as upstream/<tag>, so
# each upstream release stays available here if the upstream repository goes
# away. Tags are created through the REST API, not pushed. Their commits come
# from the upstream merges into main; a tag on a commit not merged yet is
# listed as not copied and copies on the first run after the merge. Existing
# copies are never moved or deleted. The first run copies every existing tag.

on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: upstream-tags
  cancel-in-progress: false

jobs:
  copy:
    if: github.repository != 'Infisical/agent-vault' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Copy new upstream tags without running fetched code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream-tags.py
